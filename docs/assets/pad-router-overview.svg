<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">PAD Router 盤面辨識與路徑規劃流程</title>
  <desc id="svg-desc">流程由 PNG 或 ADB 截圖輸入，經過 6 乘 5 盤面辨識與人工修正，再進入路徑規劃。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#8FB7D9"/>
    </marker>
    <style>
      .background { fill: #0B1220; }
      .panel { fill: #16243A; stroke: #4A6685; stroke-width: 2; }
      .heading { fill: #F8FAFC; font-family: sans-serif; font-size: 25px; font-weight: 700; }
      .label { fill: #D9E7F4; font-family: sans-serif; font-size: 17px; font-weight: 600; }
      .small { fill: #B8CBE0; font-family: sans-serif; font-size: 15px; }
      .flow { fill: none; stroke: #8FB7D9; stroke-width: 4; marker-end: url(#arrow); }
      .orb { stroke: #F8FAFC; stroke-width: 2; }
      .fire { fill: #E45756; }
      .water { fill: #4D9DE0; }
      .wood { fill: #64B96A; }
      .light { fill: #E5C454; }
      .dark { fill: #9A70C8; }
      .heart { fill: #E98AB6; }
      .route { fill: none; stroke: #FFD166; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .route-dot { fill: #FFD166; stroke: #0B1220; stroke-width: 3; }
    </style>
  </defs>

  <rect class="background" width="1200" height="560" rx="24"/>
  <text x="56" y="58" class="heading" fill="#F8FAFC" font-family="sans-serif" font-size="25" font-weight="700">PAD Router</text>
  <text x="56" y="88" class="small" fill="#B8CBE0" font-family="sans-serif" font-size="15">以可驗證的 6×5 盤面資料規劃轉珠路徑</text>

  <g role="group" aria-label="來源截圖">
    <rect class="panel" x="48" y="132" width="230" height="330" rx="18"/>
    <text x="78" y="180" class="heading" fill="#F8FAFC" font-family="sans-serif" font-size="25" font-weight="700">來源</text>
    <text x="78" y="210" class="small" fill="#B8CBE0" font-family="sans-serif" font-size="15">固定輸入格式</text>
    <rect x="78" y="242" width="170" height="62" rx="12" fill="#243A57" stroke="#8FB7D9" stroke-width="2"/>
    <text x="163" y="281" text-anchor="middle" class="label" fill="#D9E7F4" font-family="sans-serif" font-size="17" font-weight="600">PNG 截圖</text>
    <rect x="78" y="330" width="170" height="62" rx="12" fill="#243A57" stroke="#8FB7D9" stroke-width="2"/>
    <text x="163" y="369" text-anchor="middle" class="label" fill="#D9E7F4" font-family="sans-serif" font-size="17" font-weight="600">Android ADB</text>
  </g>

  <path class="flow" d="M278 298H330"/>

  <g role="group" aria-label="辨識與人工修正">
    <rect class="panel" x="330" y="132" width="430" height="330" rx="18"/>
    <text x="362" y="180" class="heading" fill="#F8FAFC" font-family="sans-serif" font-size="25" font-weight="700">辨識與人工修正</text>
    <text x="362" y="210" class="small" fill="#B8CBE0" font-family="sans-serif" font-size="15">HSV／局部特徵；不確定時保留問號</text>
    <rect x="372" y="236" width="346" height="182" rx="12" fill="#0F1B2D" stroke="#6D88A5" stroke-width="2"/>
    <!-- 6 columns × 5 rows -->
    <g class="orb" role="img" aria-label="6 欄 5 列盤面">
      <circle class="heart" cx="412" cy="266" r="17"/><circle class="fire" cx="468" cy="266" r="17"/><circle class="light" cx="524" cy="266" r="17"/><circle class="heart" cx="580" cy="266" r="17"/><circle class="water" cx="636" cy="266" r="17"/><circle class="dark" cx="692" cy="266" r="17"/>
      <circle class="fire" cx="412" cy="300" r="17"/><circle class="water" cx="468" cy="300" r="17"/><circle class="wood" cx="524" cy="300" r="17"/><circle class="light" cx="580" cy="300" r="17"/><circle class="dark" cx="636" cy="300" r="17"/><circle class="heart" cx="692" cy="300" r="17"/>
      <circle class="water" cx="412" cy="334" r="17"/><circle class="heart" cx="468" cy="334" r="17"/><circle class="fire" cx="524" cy="334" r="17"/><circle class="wood" cx="580" cy="334" r="17"/><circle class="light" cx="636" cy="334" r="17"/><circle class="dark" cx="692" cy="334" r="17"/>
      <circle class="wood" cx="412" cy="368" r="17"/><circle class="light" cx="468" cy="368" r="17"/><circle class="dark" cx="524" cy="368" r="17"/><circle class="heart" cx="580" cy="368" r="17"/><circle class="fire" cx="636" cy="368" r="17"/><circle class="water" cx="692" cy="368" r="17"/>
      <circle class="light" cx="412" cy="402" r="17"/><circle class="dark" cx="468" cy="402" r="17"/><circle class="heart" cx="524" cy="402" r="17"/><circle class="water" cx="580" cy="402" r="17"/><circle class="wood" cx="636" cy="402" r="17"/><circle class="fire" cx="692" cy="402" r="17"/>
    </g>
    <circle cx="692" cy="300" r="22" fill="none" stroke="#FFD166" stroke-width="3" stroke-dasharray="5 4"/>
    <text x="692" y="306" text-anchor="middle" fill="#0B1220" font="700 15px sans-serif">?</text>
  </g>

  <path class="flow" d="M760 298H812"/>

  <g role="group" aria-label="路徑規劃">
    <rect class="panel" x="812" y="132" width="340" height="330" rx="18"/>
    <text x="844" y="180" class="heading" fill="#F8FAFC" font-family="sans-serif" font-size="25" font-weight="700">路徑規劃</text>
    <text x="844" y="210" class="small" fill="#B8CBE0" font-family="sans-serif" font-size="15">規則條件 → Candidate Route</text>
    <rect x="846" y="236" width="260" height="182" rx="12" fill="#0F1B2D" stroke="#6D88A5" stroke-width="2"/>
    <g class="orb" role="img" aria-label="帶有規劃路徑的 6 欄 5 列盤面">
      <circle class="heart" cx="866" cy="255" r="15"/><circle class="fire" cx="910" cy="255" r="15"/><circle class="light" cx="954" cy="255" r="15"/><circle class="heart" cx="998" cy="255" r="15"/><circle class="water" cx="1042" cy="255" r="15"/><circle class="dark" cx="1086" cy="255" r="15"/>
      <circle class="fire" cx="866" cy="291" r="15"/><circle class="water" cx="910" cy="291" r="15"/><circle class="wood" cx="954" cy="291" r="15"/><circle class="light" cx="998" cy="291" r="15"/><circle class="dark" cx="1042" cy="291" r="15"/><circle class="heart" cx="1086" cy="291" r="15"/>
      <circle class="water" cx="866" cy="327" r="15"/><circle class="heart" cx="910" cy="327" r="15"/><circle class="fire" cx="954" cy="327" r="15"/><circle class="wood" cx="998" cy="327" r="15"/><circle class="light" cx="1042" cy="327" r="15"/><circle class="dark" cx="1086" cy="327" r="15"/>
      <circle class="wood" cx="866" cy="363" r="15"/><circle class="light" cx="910" cy="363" r="15"/><circle class="dark" cx="954" cy="363" r="15"/><circle class="heart" cx="998" cy="363" r="15"/><circle class="fire" cx="1042" cy="363" r="15"/><circle class="water" cx="1086" cy="363" r="15"/>
      <circle class="light" cx="866" cy="399" r="15"/><circle class="dark" cx="910" cy="399" r="15"/><circle class="heart" cx="954" cy="399" r="15"/><circle class="water" cx="998" cy="399" r="15"/><circle class="wood" cx="1042" cy="399" r="15"/><circle class="fire" cx="1086" cy="399" r="15"/>
    </g>
    <path class="route" d="M866 399L866 363L910 363L910 327L954 327L954 291L998 291L998 255L1042 255L1086 255"/>
    <circle class="route-dot" cx="866" cy="399" r="7"/><circle class="route-dot" cx="866" cy="363" r="7"/><circle class="route-dot" cx="910" cy="363" r="7"/><circle class="route-dot" cx="910" cy="327" r="7"/><circle class="route-dot" cx="954" cy="327" r="7"/><circle class="route-dot" cx="954" cy="291" r="7"/><circle class="route-dot" cx="998" cy="291" r="7"/><circle class="route-dot" cx="998" cy="255" r="7"/><circle class="route-dot" cx="1042" cy="255" r="7"/><circle class="route-dot" cx="1086" cy="255" r="7"/>
  </g>

  <text x="600" y="520" text-anchor="middle" class="small" fill="#B8CBE0" font-family="sans-serif" font-size="15">辨識不足時拒判並要求人工修正；實際手勢仍需校正、ADB 與手勢後驗證</text>
</svg>
